name: Sync Docs to Target Repo

on:
  push:
    branches: [ master ]
    paths:
      - 'README.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to target repo
        run: |
          git config --global user.name "Auto Sync"
          git config --global user.email "action@github.com"
          git clone https://${{ secrets.CROSS_REPO_PAT }}@github.com/LALAnimeimei/SSHTamplet.git target_repo
          cp -r docs README.md target_repo/ 2>/dev/null || true
          cd target_repo
          git add .
          git commit -m "Auto sync docs" || true
          git push
